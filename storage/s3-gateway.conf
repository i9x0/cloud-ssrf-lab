# S3 API gateway in front of SeaweedFS. Acts as our "CloudTrail": every API call is logged
# with the caller's IP and the access-key ID taken from the SigV4 Authorization header
# (the signature itself is never logged).
map $http_authorization $s3_akid {
    "~Credential=(?<akid>[A-Za-z0-9]+)/" $akid;
    default "-";
}

log_format s3json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"akid":"$s3_akid","bytes":$body_bytes_sent,"ua":"$http_user_agent"}';

server {
    listen 9000;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log /logs/s3-access.jsonl s3json;

    location / {
        proxy_pass http://10.0.9.20:8333;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }
}
